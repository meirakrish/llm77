# Settings for the job queue, job events and stats

# BullMQ requires this: evicting keys under memory pressure would silently lose queued jobs
maxmemory-policy noeviction

# Persist to /data so queued jobs, history and stats survive restarts: the append-only log, synced
# every second, plus periodic snapshots
dir /data
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Reachable from other containers; protect it with the network (or set requirepass) when exposing it
bind 0.0.0.0
protected-mode no
