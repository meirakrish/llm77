server {
  listen 8080;
  root /usr/share/nginx/html;

  # Matches the API's upload limit for knowledge base files
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Streamed answers (Server-Sent Events) must reach the browser as they are produced
    proxy_buffering off;
    proxy_cache off;
    # A queued job can wait a long time before its first token
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets never change; the page itself is always revalidated
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
